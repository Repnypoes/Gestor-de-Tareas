<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pernypoes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Mi Gestor de Tareas</h1>

        <!-- Formulario para agregar tarea -->
        <form id="task-form">
            <input type="text" id="task-input" placeholder="¿Qué necesitas hacer hoy?" required>
            <button type="submit">Agregar</button>
        </form>

        <!-- Lista de tareas -->
        <ul id="task-list">
            <!-- Las tareas se inyectarán aquí con JavaScript -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
